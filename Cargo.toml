[package]
name = "greentic-deploy-contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Wire types for the Greentic admin → designer deploy and environment seam."
repository = "https://github.com/greentic-biz/greentic-deploy-contract"

[dependencies]
serde = { version = "1.0.181", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
ed25519-dalek = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }

[features]
# DSSE Ed25519 sign/verify for execution authorisations (`dsse::sign`,
# `dsse::verify`, `dsse::parse_trusted_keys`). Off by default: the crate's
# default build stays types and serde only.
signing = ["dep:ed25519-dalek", "dep:base64"]

[dev-dependencies]
# Adds `Utc::now()` for tests only; the library itself stays clock-free.
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc", "clock"] }
